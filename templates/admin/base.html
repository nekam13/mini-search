{% extends "base_clay.html" %}

{% block subtitle %}Správa indexu a zdrojů{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">{% endblock %}
{% block footer %}Mini Search v7.3 · Clay admin panel{% endblock %}

{% block flash %}
<div id="flash" class="msg {% if message_ok is defined and message_ok %}msg-ok{% else %}msg-err{% endif %}"
     style="{% if not message %}display:none{% endif %}">{{ message }}</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
